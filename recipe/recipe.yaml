schema_version: 1

context:
  name: cwl-utils
  version: "0.46"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 6a0192a30c01c1c9af444b173b29a2d140a7f0c7326c2d6c7c694a9a0b21a46d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cwl-cite-extract = cwl_utils.cite_extract:main
      - cwl-docker-extract = cwl_utils.docker_extract:main
      - cwl-expression-refactor = cwl_utils.expression_refactor:main
      - cwl-graph-split = cwl_utils.graph_split:main
      - cwl-normalizer = cwl_utils.normalizer:main
      - cwl-inputs-schema-gen = cwl_utils.inputs_schema_gen:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling >=1.27.0
  run:
    - python >=${{ python_min }}
    - cwl-upgrader >=1.2.3
    # cwl-upgrader is for cwl-normalizer (cwl_utils/normalizer.py)
    - cwlformat
    # cwlformat is from extras[pretty], for cwl-graph-split. An alternative for this would be to build for
    # multiple outputs, e.g. https://github.com/conda-forge/matplotlib-feedstock/blob/2ca6433797f0a4f77fee890c6fa39617a6a6b0b4/recipe/meta.yaml#L17
    - packaging
    - rdflib
    - requests
    - schema-salad >=8.10.20260810193251,<9
    - ruamel.yaml >=0.17.6,<0.20
    - typing_extensions >=4.10.0

tests:
  - python:
      imports:
        - cwl_utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - pytest-xdist
        - pytest-mock >=1.10.0
        - nodejs
        - jsonschema >=4.21.1
        - udocker
        - cwltool
    script:
      - cwl-cite-extract --help
      - cwl-docker-extract --help
      - cwl-expression-refactor --help
      - cwl-graph-split --help
      - cwl-normalizer --help
      - cwl-inputs-schema-gen --help
      - python -m pytest -n auto --pyargs cwl_utils

about:
  license: Apache-2.0
  license_file:
    - LICENSE
  summary: Python utilities for CWL
  homepage: https://github.com/common-workflow-language/cwl-utils
  repository: https://github.com/common-workflow-language/cwl-utils/

extra:
  recipe-maintainers:
    - mr-c
    - kinow
